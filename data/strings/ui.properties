hop.bitterness.formula.TINSETH = Tinseth
hop.bitterness.formula.TINSETH_BEERSMITH = Tinseth (BS)
hop.bitterness.formula.RAGER = Rager
hop.bitterness.formula.GARETZ = Garetz
hop.bitterness.formula.DANIELS = Daniels
hop.bitterness.formula.MIBU = mIBU
hop.bitterness.formula.BREWDAY = Brewday
bitterness.model.desc.TINSETH = Glenn Tinseth has published his \
  method on https://www.realbeer.com/hops/research.html in 1997. It was the \
  first to use a formula instead of a graph or table for the relationship \
  between hop utilisation and boil time. Today it is the most widely used \
  home brewing bitterness model.
bitterness.model.desc.TINSETH_BEERSMITH = BeerSmith tweaks Tinseth's \
  equation by using pre boil volume less trub and chiller loss instead of \
  batch volume, and using pre-boil gravity instead of average wort gravity. \
  These errors cancel each other out to some extent. Use this method to \
  mimic BeerSmith "Tinseth" results as closely as possible.
bitterness.model.desc.RAGER = Jackie Rager's Zymurgy article (1990) was the \
  first article in the homebrew literature that attempted to estimate hop \
  utilisation rates. It still is widely used because of its accuracy and \
  simplicity. This method gives utilization values for different boiling times \
  as well as a correction factor for boil gravity.
bitterness.model.desc.GARETZ = Mark Garetz published a method to estimate hop \
  utilisation rates in his book "Using Hops" (1994). It includes a table of \
  utilisation values for different boil times, like the earlier Rager method, \
  but the new values are significantly lower than the Rager values. \
  The correction for boil gravity given in the Rager article is used, and new \
  formulas for correction factors for boil temperature and hopping rate are included.
bitterness.model.desc.DANIELS = Published in 1996, Ray Daniel's method gives \
  tabular values for utilisation rate versus boil time. The boil gravity \
  correction by Rager is included in the method, as is the correction for \
  hopping rate from Garetz.
bitterness.model.desc.MIBU = The Maximum IBU (mIBU) model from Alchemy Overlord extends Tinseth to model \
  post-flameout bitterness while wort cools (whirlpool / hop stand). Boil-step \
  IBU matches Tinseth; additional IBU is added on Stand steps. Values are often \
  higher than Tinseth, especially for late hops. See \
  https://alchemyoverlord.wordpress.com/2015/05/12/a-modified-ibu-measurement-especially-for-late-hopping/\n \
  Configure kettle diameter on the equipment profile for best accuracy.
bitterness.model.desc.BREWDAY = Brewday derives IBU from tracked iso-alpha acid mass \
  in the wort: IBU is approximately iso-alpha milligrams divided by volume in litres. \
  Hop steps update iso-alpha mass via the existing hop-acid tracking; this model \
  does not use a separate utilisation formula. Soluble fermentable extract bitterness \
  contributions are not included.

settings.mash.ph.model = Mash pH Model
mash.ph.model.EZ_WATER = EZ Water (v3.0.2)
mash.ph.model.desc.EZ_WATER = \
  The EZ Water Calculator was created by "TH" using references from Kai Troester \
  and John Palmer. It predicts a distilled water mash pH from the distilled \
  water pH values of the grain bill, then estimates the room temperature mash \
  pH by modifying that using the residual alkalinity of the mash water.\n \
See https://ezwatercalculator.com.
mash.ph.model.MPH = MpH (v4.20)
mash.ph.model.mph.malt.correction.factor = Malt Buffering Correction Factor
mash.ph.model.desc.MPH = \
  DM Riffe created the MpH Water Calculator. It is based on A.J. deLange's ideas \
  regarding charge conservation when mixing different malts or adding acids to \
  the mash, and experiments that Mick Spencer and Riffe did on the grist pH and \
  buffering capacity of various malts.\n \
See http://homebrewingphysics.blogspot.com.
mash.ph.model.KAISER_WATER = Kaiser Water (v1.58)
mash.ph.model.desc.KAISER_WATER = \
  Kai Troester's Kaiser Water calculator predicts mash pH from base and specialty \
  malt roles, residual alkalinity in mEq/L, and a mash-thickness-dependent slope. \
  Specialty malt acidity is estimated from malt colour where needed.\n \
See http://braukaiser.com/wiki/index.php/Beer_color,_alkalinity_and_mash_pH and \
http://braukaiser.com/documents/Kaiser_water_calculator_US_units.xls.
mash.ph.model.Z_PH = Z pH (Water Book)
mash.ph.model.desc.Z_PH = \
  John Palmer and Colin Kaminski's Z alkalinity / Z pH model from Water: A Comprehensive \
  Guide for Brewers. Mash pH is found by bisection where water Z-alkalinity, per-malt \
  buffering at trial pH, and acid additions balance to zero milli-equivalents.\n \
See Water: A Comprehensive Guide for Brewers (Palmer & Kaminski).

